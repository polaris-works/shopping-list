<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0e">
    <meta name="theme-color" content="#f4f3f1">
    <title>Bodega - Privacy</title>
    <meta http-equiv="refresh" content="0; url=https://polaris-works.github.io/bodega/privacy.html">
    <link rel="canonical" href="https://polaris-works.github.io/bodega/privacy.html">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="./design-system/design-system.css">
    <style>
      /* Unlayered, so it wins over the app layout of the design system. */
      html,
      body {
        height: auto;
      }

      body {
        display: block;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        line-height: 1.55;
      }

      main {
        overflow: visible;
        max-width: 42rem;
        margin: 0 auto;
        padding: var(--space-6) var(--space-4) var(--space-7);
      }

      h1 {
        margin: 0 0 var(--space-2);
        font-size: 1.75rem;
        line-height: 1.2;
      }

      h2 {
        margin: var(--space-6) 0 var(--space-2);
        font-size: 1.125rem;
      }

      p,
      ul {
        margin: 0 0 var(--space-3);
      }

      ul {
        padding-left: var(--space-5);
      }

      .updated {
        color: var(--muted);
      }

      a {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Privacy</h1>
      <p>
        The privacy policy of Bodega is now at
        <a href="https://polaris-works.github.io/bodega/privacy.html">polaris-works.github.io/bodega/privacy.html</a>.
        To delete your account, see
        <a href="https://polaris-works.github.io/bodega/delete-account.html">polaris-works.github.io/bodega/delete-account.html</a>.
      </p>
      <p><a href="./">Back to Bodega</a></p>
    </main>
  </body>
</html>
